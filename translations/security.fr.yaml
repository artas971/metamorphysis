# Translations pour le domaine 'security' en français
"An authentication exception occurred.": "Une erreur d'authentification est survenue."
"Authentication credentials could not be found.": "Les identifiants d'authentification n'ont pas pu être trouvés."
"Authentication request could not be processed due to a system problem.": "La demande d'authentification n'a pas pu être traitée en raison d'un problème système."
"Invalid credentials.": "Identifiants invalides. Veuillez vérifier votre adresse e-mail ou votre mot de passe."
"Cookie has already been used by someone else.": "Le cookie a déjà été utilisé par quelqu'un d'autre."
"Sign in to start your session": "Connectez-vous pour démarrer votre session"
"Account is disabled.": "Ce compte est désactivé."
"Account is locked.": "Ce compte est verrouillé."
"Too many failed login attempts, please try again later.": "Trop de tentatives de connexion échouées, veuillez réessayer plus tard."
"Invalid CSRF token.": "Jeton CSRF invalide. Veuillez rafraîchir la page et réessayer."
"No authentication provider found to support the authentication token.": "Aucun fournisseur d'authentification n'a été trouvé pour supporter le jeton d'authentification."
"No session available, it either timed out or cookies are not enabled.": "Aucune session disponible, elle a expiré ou les cookies ne sont pas activés."
"No token could be found.": "Aucun jeton n'a pu être trouvé."
"Username could not be found.": "Aucun compte n'a été trouvé avec cette adresse e-mail."
"Account has expired.": "Ce compte a expiré."
"Credentials have expired.": "Les identifiants ont expiré."
