<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Dégradé or pour la lame d'épée -->
    <linearGradient id="bladeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C78D"/>
      <stop offset="100%" stop-color="#C5A566"/>
    </linearGradient>
    <linearGradient id="bladeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7836"/>
      <stop offset="100%" stop-color="#7B5B20"/>
    </linearGradient>
  </defs>

  <g fill="#B89A63" stroke="#B89A63" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tête et Yeux Délicats -->
    <circle cx="60" cy="15" r="4" stroke-width="0"/>
    <circle cx="55.8" cy="14.2" r="1.8" stroke-width="0"/>
    <circle cx="64.2" cy="14.2" r="1.8" stroke-width="0"/>
    
    <!-- Antennes élégantes -->
    <path d="M58 12 C55 6, 47 4, 40 3.5" fill="none" stroke-width="1.6"/>
    <path d="M62 12 C65 6, 73 4, 80 3.5" fill="none" stroke-width="1.6"/>
    
    <!-- Thorax / Poignée supérieure (Grip) -->
    <path d="M57 19 C56.5 24, 56.5 31, 57.5 35 C58.8 36.5, 61.2 36.5, 62.5 35 C63.5 31, 63.5 24, 63 19 Z" stroke-width="0.5"/>
    <line x1="57.5" y1="23" x2="62.5" y2="23" stroke="#8E6F2E" stroke-width="1"/>
    <line x1="57.5" y1="27" x2="62.5" y2="27" stroke="#8E6F2E" stroke-width="1"/>
    <line x1="57.5" y1="31" x2="62.5" y2="31" stroke="#8E6F2E" stroke-width="1"/>

    <!-- AILES SUPÉRIEURES (Plein galbe aérodynamique, bien remplies aux extrémités) -->
    <path d="M57 23 C42 16, 20 12, 3.5 15 C1 15.5, 0 19, 2 21.5 C8.5 28, 28 32.5, 56 30.5 Z" stroke-width="0.5"/>
    <path d="M63 23 C78 16, 100 12, 116.5 15 C119 15.5, 120 19, 118 21.5 C111.5 28, 92 32.5, 64 30.5 Z" stroke-width="0.5"/>

    <!-- AILES INFÉRIEURES (Harmonieuses & bien visibles) -->
    <path d="M56.5 32 C43 30, 25 30, 11 36.5 C8.5 38, 8.5 41, 10.5 43 C17 50, 36 50, 56.5 41 Z" stroke-width="0.5"/>
    <path d="M63.5 32 C77 30, 95 30, 109 36.5 C111.5 38, 111.5 41, 109.5 43 C103 50, 84 50, 63.5 41 Z" stroke-width="0.5"/>

    <!-- ========================================= -->
    <!-- GARDE D'ÉPÉE ROYALE ET LAME ACÉRÉE (QUEUE)-->
    <!-- ========================================= -->
    
    <!-- Garde sculptée horizontale avec quillons évasés -->
    <!-- Barre de garde -->
    <path d="M42 38.5 C46 38.5, 54 39, 60 39.5 C66 39, 74 38.5, 78 38.5 C80.5 38.5, 81.5 40.5, 80 42 C76 43, 67 43.5, 60 43.5 C53 43.5, 44 43, 40 42 C38.5 40.5, 39.5 38.5, 42 38.5 Z" fill="#B89A63" stroke-width="0.6"/>
    
    <!-- Pommeaux sphériques aux extrémités de la garde -->
    <circle cx="41" cy="40.5" r="2.8" fill="#D8B978" stroke="#7B5B20" stroke-width="0.8"/>
    <circle cx="79" cy="40.5" r="2.8" fill="#D8B978" stroke="#7B5B20" stroke-width="0.8"/>
    <!-- Joyau central de la garde -->
    <circle cx="60" cy="41" r="3.4" fill="#F0DCAB" stroke="#7B5B20" stroke-width="0.8"/>
    <circle cx="60" cy="41" r="1.4" fill="#FFF8E0" stroke-width="0"/>

    <!-- Écusson sous la garde (Ricasso) -->
    <polygon points="56,43.5 64,43.5 63.5,49 56.5,49" fill="#9A7836" stroke-width="0.5"/>

    <!-- LAME D'ÉPÉE (Grand biseau symétrique) -->
    <!-- Face Gauche Lumineuse -->
    <polygon points="60,45 54.5,50 60,117" fill="url(#bladeLeft)" stroke-width="0.4"/>
    <!-- Face Droite Ombre/Relief -->
    <polygon points="60,45 65.5,50 60,117" fill="url(#bladeRight)" stroke-width="0.4"/>

    <!-- Gouttière centrale / Rainure de sang de l'épée -->
    <polygon points="60,49 58,54 60,96" fill="#7B5B20" opacity="0.65" stroke-width="0"/>
    <polygon points="60,49 62,54 60,96" fill="#4E3710" opacity="0.65" stroke-width="0"/>

    <!-- Arête centrale lumineuse traversant toute la lame jusqu'à la pointe -->
    <line x1="60" y1="44" x2="60" y2="117" stroke="#FFF7D6" stroke-width="1.3"/>
    
    <!-- Fil de la lame (Contours tranchants) -->
    <polyline points="54.5,50 60,117 65.5,50" fill="none" stroke="#B89A63" stroke-width="0.8"/>
  </g>
</svg>
